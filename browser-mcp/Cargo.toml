[package]
name = "codex-unchained-browser-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-std", "io-util"] }
uuid = { version = "1", features = ["v4"] }
