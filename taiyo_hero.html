<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiyo Munch Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --taiyo-yellow: rgb(255, 248, 216);
            --taiyo-accent-yellow: rgb(255, 240, 168);
            --taiyo-brown: rgb(64, 38, 0);
            --taiyo-white: #ffffff;
            --taiyo-orange: #f39c12;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito Sans', sans-serif;
            background-color: var(--taiyo-yellow);
            overflow-x: hidden;
        }

        .hero-container {
            position: relative;
            width: 100%;
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            box-sizing: border-box;
            background-color: var(--taiyo-yellow);
        }

        /* The Sun in the extreme top right */
        .hero-sun {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #fff9c4 0%, #ffeb3b 50%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
            filter: blur(20px);
            opacity: 0.8;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .hero-text-side {
            position: relative;
        }

        /* Funky Brush Stroke behind text */
        .brush-stroke {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 110%;
            background: url('https://www.transparenttextures.com/patterns/brushed-alum.png'), 
                        linear-gradient(120deg, rgba(255, 240, 168, 0.8) 0%, rgba(255, 240, 168, 0.4) 100%);
            clip-path: polygon(2% 15%, 95% 5%, 98% 85%, 5% 95%, 0% 50%); /* Abstract brush-like shape */
            z-index: -1;
            filter: blur(2px);
            opacity: 0.9;
        }

        .hero-title {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            color: var(--taiyo-brown);
            line-height: 1.1;
            margin: 0 0 20px 0;
            text-transform: capitalize;
        }

        .hero-subtitle {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            color: var(--taiyo-brown);
            margin-bottom: 35px;
            font-weight: 600;
            opacity: 0.9;
            max-width: 90%;
        }

        /* Button Styles */
        .cta-button {
            display: inline-block;
            padding: 18px 35px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 6px 0px rgba(0,0,0,0.1);
        }

        .cta-primary {
            background-color: var(--taiyo-brown);
            color: var(--taiyo-yellow);
            border: 2px solid var(--taiyo-brown);
        }

        .cta-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0px rgba(0,0,0,0.1);
            filter: brightness(1.1);
        }

        .hero-image-side {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .hero-main-img {
            width: 100%;
            max-width: 600px;
            height: auto;
            filter: drop-shadow(20px 20px 30px rgba(0,0,0,0.15));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 768px) {
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-text-side {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .hero-subtitle {
                max-width: 100%;
            }
            .hero-image-side {
                order: -1;
            }
        }
    </style>
</head>
<body>

    <section class="hero-container">
        <div class="hero-sun"></div>
        
        <div class="hero-content">
            <div class="hero-text-side">
                <div class="brush-stroke"></div>
                <h1 class="hero-title">Deliciously <br>Frozen Treats</h1>
                <p class="hero-subtitle">Experience the creamy, dreamy taste of Taiyo Munch. Handcrafted for pure joy.</p>
                <a href="#" class="cta-button cta-primary">Shop Now</a>
            </div>
            
            <div class="hero-image-side">
                <!-- Using a high-quality free stock image for a frozen treat / ice cream bar -->
                <img src="https://images.unsplash.com/photo-1501443762994-82bd5dabb8d2?auto=format&fit=crop&q=80&w=800" alt="Taiyo Munch Treat" class="hero-main-img">
            </div>
        </div>
    </section>

</body>
</html>
