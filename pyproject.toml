[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advertpreneur-cli"
version = "0.21.2"
description = "Advertpreneur's interactive model-powered coding CLI"
requires-python = ">=3.10"
dependencies = [
  "prompt_toolkit>=3.0.52,<4",
  "rich>=13.7,<15",
  "playwright>=1.47,<2",
]

[project.scripts]
advertpreneur = "advertpreneur_cli.cli:main"
adp = "advertpreneur_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["advertpreneur_cli*"]

[tool.setuptools.package-data]
advertpreneur_cli = ["assets/*", "browser_extension/*", "browser_extension/icons/*"]
