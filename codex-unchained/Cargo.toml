
[workspace]
members = [
  "crates/adp-protocol",
  "crates/adp-memory",
  "crates/adp-runtime",
  "crates/adp-browser-bridge",
  "crates/adp-browser-broker",
  "crates/adp-executor",
  "crates/adp-model",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
axum = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
