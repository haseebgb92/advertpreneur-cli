
[workspace]
members = [
  "crates/adp-protocol",
  "crates/adp-memory",
  "crates/adp-runtime",
  "crates/adp-browser-bridge",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
