name: Release Advertpreneur CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate version tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($tag -ne $version) { throw "Tag v$tag does not match pyproject.toml version $version" }

      - name: Test updater and packaging
        run: python -m unittest tests.test_tui tests.test_working_ui tests.test_updater tests.test_release_package

      - name: Build release assets
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $extension = python -c "import json; print(json.load(open('browser-extension/manifest.json'))['version'])"
          python -m advertpreneur_cli.release_packaging --source . --output dist/release --version $version --extension-version $extension

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/release/* INSTALL.ps1 --repo ${{ github.repository }} --generate-notes
