name: Codex Unchained CI

on:
  push:
    branches: [codex-unchained-v0.1]
  pull_request:

jobs:
  adapters:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build brain gateway
        run: cargo build --release --manifest-path agy-gateway/Cargo.toml

      - name: Test brain gateway
        run: cargo test --manifest-path agy-gateway/Cargo.toml

      - name: Build browser MCP
        run: cargo build --release --manifest-path browser-mcp/Cargo.toml

      - name: Test browser MCP
        run: cargo test --manifest-path browser-mcp/Cargo.toml

      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'install.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'bin/codex-unchained.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

  scripts-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n bin/codex-unchained
      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/content.js
          python3 -m json.tool extension/manifest.json >/dev/null

  upstream-codex-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Unchained adapters
        run: |
          cargo build --release --manifest-path agy-gateway/Cargo.toml
          cargo build --release --manifest-path browser-mcp/Cargo.toml

      - name: Install pinned official Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < UPSTREAM_CODEX_VERSION)"
          curl -fsSL https://chatgpt.com/codex/install.sh |
            env CODEX_RELEASE="$VERSION" CODEX_NON_INTERACTIVE=1 sh
          "$HOME/.local/bin/codex" --version

      - name: Create fake model-only AGY backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/agy" <<'PY'
          #!/usr/bin/env python3
          import json
          import sys

          if len(sys.argv) > 1 and sys.argv[1] == "models":
              print("fake-model Fake model")
              raise SystemExit(0)

          prompt = ""
          for line in sys.stdin:
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("event") == "user":
                  prompt = event.get("message", {}).get("content", "")
                  break

          if '"type": "function_call_output"' in prompt:
              decision = {
                  "type": "assistant",
                  "content": "UNCHAINED_TOOL_LOOP_OK",
                  "tool_calls": [],
              }
          elif '"name": "exec_command"' in prompt:
              decision = {
                  "type": "tool_calls",
                  "content": "",
                  "tool_calls": [{
                      "tool_name": "exec_command",
                      "tool_namespace": "",
                      "arguments": {"cmd": "printf UNCHAINED_EXEC_OK"},
                      "input": "",
                  }],
              }
          else:
              decision = {
                  "type": "assistant",
                  "content": "UNCHAINED_SMOKE_OK",
                  "tool_calls": [],
              }

          print(json.dumps({
              "event": "init",
              "conversation_id": "fake-ci",
              "init": {"tools": [], "permission_mode": "request-review"}
          }))
          print(json.dumps({
              "event": "result",
              "result": {
                  "conversation_id": "fake-ci",
                  "status": "SUCCESS",
                  "response": json.dumps(decision),
                  "structured_output": decision,
                  "num_turns": 1,
                  "usage": {
                      "input_tokens": 0,
                      "output_tokens": 0,
                      "thinking_tokens": 0,
                      "cache_read_tokens": 0,
                      "total_tokens": 0
                  }
              }
          }))
          PY
          chmod +x "$RUNNER_TEMP/fakebin/agy"

      - name: Verify real Unchained launcher, native catalog, MCP and Codex tool loop
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/fakebin:$HOME/.local/bin:$PATH"
          export UNCHAINED_AGY_BIN="$RUNNER_TEMP/fakebin/agy"
          export UNCHAINED_CODEX_BIN="$HOME/.local/bin/codex"
          export UNCHAINED_AGY_GATEWAY_BIN="$PWD/agy-gateway/target/release/codex-unchained-agy-gateway"
          export UNCHAINED_BROWSER_MCP_BIN="$PWD/browser-mcp/target/release/codex-unchained-browser-mcp"
          export UNCHAINED_HOME="$RUNNER_TEMP/unchained"

          bash bin/codex-unchained exec \
            --dangerously-bypass-approvals-and-sandbox \
            --skip-git-repo-check \
            -m agy/fake-model \
            'Use exec_command once, then report completion.' \
            2>&1 | tee codex-smoke.log

          grep -q 'UNCHAINED_TOOL_LOOP_OK' codex-smoke.log

          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["UNCHAINED_HOME"], "models.json")
          data = json.load(open(path, encoding="utf-8"))
          slugs = [m["slug"] for m in data["models"]]
          assert "agy/fake-model" in slugs, slugs
          model = next(m for m in data["models"] if m["slug"] == "agy/fake-model")
          assert model["visibility"] == "list"
          assert model["tool_mode"] == "direct"
          assert model["model_messages"]["instructions_template"]
          PY
