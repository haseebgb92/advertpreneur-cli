name: Codex Upstream Compatibility

on:
  push:
    branches:
      - "codex-unchained-*"
    paths:
      - "codex-unchained/upstream-patches/**"
      - ".github/workflows/codex-upstream-compat.yml"
  pull_request:
    paths:
      - "codex-unchained/upstream-patches/**"
      - ".github/workflows/codex-upstream-compat.yml"

jobs:
  upstream-tool-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fetch pinned Codex upstream
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cat codex-unchained/upstream-patches/UPSTREAM_SHA)"
          git init /tmp/codex
          git -C /tmp/codex remote add origin https://github.com/openai/codex.git
          git -C /tmp/codex fetch --depth=1 origin "$SHA"
          git -C /tmp/codex checkout --detach FETCH_HEAD
          test "$(git -C /tmp/codex rev-parse HEAD)" = "$SHA"
      - name: Apply ADP compatibility surgery
        run: |
          python codex-unchained/upstream-patches/apply_0001.py /tmp/codex
          python codex-unchained/upstream-patches/apply_0002.py /tmp/codex
          python codex-unchained/upstream-patches/apply_0003.py /tmp/codex
          python codex-unchained/upstream-patches/apply_0004.py /tmp/codex
          python codex-unchained/upstream-patches/apply_0005.py /tmp/codex
      - name: Validate patch formatting
        shell: bash
        run: |
          set -euo pipefail
          git -C /tmp/codex diff --check
          cd /tmp/codex/codex-rs
          cargo fmt --all -- --check
      - name: Show exact upstream diff
        run: |
          git -C /tmp/codex diff -- \
            codex-rs/core/src/tools/handlers/tool_search.rs \
            codex-rs/core/src/tools/context.rs \
            codex-rs/core/src/tools/context_tests.rs \
            codex-rs/models-manager/src/model_info.rs \
            codex-rs/models-manager/src/model_info_tests.rs \
            codex-rs/utils/home-dir/src/lib.rs \
            codex-rs/cli/src/main.rs \
            codex-rs/tui/src/slash_command.rs \
            codex-rs/tui/src/chatwidget/slash_dispatch.rs \
            codex-rs/tui/src/chatwidget/settings.rs \
            codex-rs/model-provider/src/models_endpoint.rs \
            codex-rs/models-manager/src/manager.rs
      - name: Run focused Codex compatibility tests
        working-directory: /tmp/codex/codex-rs
        run: |
          cargo test -p codex-core function_tool_search_ --lib
          cargo test -p codex-core tool_search_payloads_roundtrip_as_tool_search_outputs --lib
          cargo test -p codex-models-manager unknown_model_keeps_local_tool_discovery_and_extension_instructions --lib
          cargo test -p codex-utils-home-dir find_codex_home_without_env_uses_default_home_dir --lib
          cargo test -p codex-tui adp_supports_inline_routing_modes --lib
          grep -q "has_authoritative_unauthenticated_catalog" model-provider/src/models_endpoint.rs
          grep -q "has_authoritative_unauthenticated_catalog" models-manager/src/manager.rs
