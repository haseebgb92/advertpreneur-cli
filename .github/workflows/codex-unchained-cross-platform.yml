name: Codex Unchained Cross-Platform Package
# packaging: parallel Cargo builds with dependency/target caches

concurrency:
  group: codex-unchained-cross-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "codex-unchained-v0.2"
    tags:
      - "codex-unchained-v*"
    paths:
      - "codex-unchained/**"
      - ".github/workflows/codex-unchained-cross-platform.yml"

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

jobs:
  linux_mint:
    if: github.ref == 'refs/heads/codex-unchained-v0.2' && github.event_name == 'push'
    name: Linux Mint x64
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download latest validated patched Codex base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '[.[] | select(.draft == false and (.tag_name | startswith("codex-unchained-v")))] | .[0].tag_name // ""')"
          test -n "$base_tag"
          root="$RUNNER_TEMP/codex-base"
          mkdir -p "$root"
          gh release download "$base_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "patched-codex-linux-x64.tar.gz" \
            --dir "$root"
          tar -xzf "$root/patched-codex-linux-x64.tar.gz" -C "$root"
          test -f "$root/patched-codex-linux-x64/codex-unchained"
          test "$(tr -d '\r\n' < "$root/patched-codex-linux-x64/UPSTREAM_SHA")" = "$(tr -d '\r\n' < codex-unchained/upstream-patches/UPSTREAM_SHA)"
          echo "CODEX_BASE_ROOT=$root/patched-codex-linux-x64" >> "$GITHUB_ENV"
          echo "Using validated Codex base: $base_tag"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: unchained-linux-cargo-${{ hashFiles('codex-unchained/Cargo.lock') }}
          restore-keys: |
            unchained-linux-cargo-

      - name: Cache ADP target
        uses: actions/cache@v4
        with:
          path: codex-unchained/target
          key: unchained-linux-target-${{ hashFiles('codex-unchained/Cargo.lock', 'codex-unchained/crates/**') }}
          restore-keys: |
            unchained-linux-target-

      - name: Validate installer
        shell: bash
        run: sh -n codex-unchained/install.sh

      - name: Build Linux helpers only
        shell: bash
        run: cargo build --manifest-path codex-unchained/Cargo.toml -p adp-unchained -p adp-mcp --release --target x86_64-unknown-linux-gnu

      - name: Test Linux helpers
        shell: bash
        run: cargo test --manifest-path codex-unchained/Cargo.toml -p adp-unchained -p adp-model-router

      - name: Assemble Linux Mint package
        shell: bash
        run: |
          dist="codex-unchained/dist/patched-codex-linux-x64"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$CODEX_BASE_ROOT/codex-unchained" "$dist/codex-unchained"
          cp "codex-unchained/target/x86_64-unknown-linux-gnu/release/adp-mcp" "$dist/adp-mcp"
          cp "codex-unchained/target/x86_64-unknown-linux-gnu/release/adp-unchained" "$dist/adp-unchained"
          cp -R codex-unchained/extension "$dist/extension"
          cp -R codex-unchained/antigravity-agent "$dist/antigravity-agent"
          cp codex-unchained/README.md "$dist/"
          cp codex-unchained/upstream-patches/UPSTREAM_SHA "$dist/"
          "$dist/codex-unchained" --version
          "$dist/adp-unchained" --help
          tar -czf codex-unchained/dist/patched-codex-linux-x64.tar.gz -C codex-unchained/dist patched-codex-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: patched-codex-linux-x64
          path: codex-unchained/dist/patched-codex-linux-x64.tar.gz
          if-no-files-found: error

  publish_linux_mint:
    name: Publish Linux Mint prerelease
    needs: linux_mint
    if: github.ref == 'refs/heads/codex-unchained-v0.2' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: patched-codex-linux-x64
          path: release-assets

      - name: Verify Linux package
        shell: bash
        run: |
          test -f release-assets/patched-codex-linux-x64.tar.gz
          sha256sum release-assets/patched-codex-linux-x64.tar.gz > release-assets/SHA256SUMS

      - name: Publish Linux Mint prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="codex-unchained-linux-v0.2.0-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            release-assets/patched-codex-linux-x64.tar.gz \
            release-assets/SHA256SUMS \
            codex-unchained/install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Codex Unchained Linux Mint v0.2 alpha ${GITHUB_RUN_NUMBER}" \
            --notes "Linux Mint/x64 fast-path release. Reuses the validated patched Codex core and rebuilds only the Unchained Rust helpers." \
            --prerelease

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/codex-unchained-v')
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: patched-codex-linux-x64
            ext: ""
            build_jobs: "4"
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: patched-codex-linux-arm64
            ext: ""
            build_jobs: "4"
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: patched-codex-macos-x64
            ext: ""
            build_jobs: "4"
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            artifact: patched-codex-macos-arm64
            ext: ""
            build_jobs: "4"
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: patched-codex-windows-x64
            ext: ".exe"
            build_jobs: "4"

    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.build_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect reusable patched Codex base
        id: codex-base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq '[.[] | select(.draft == false and (.tag_name | startswith("codex-unchained-v")))] | .[0].tag_name // ""')"
          reuse=false
          if [ -n "$base_tag" ]; then
            git fetch --no-tags --depth=1 origin "refs/tags/$base_tag:refs/tags/$base_tag"
            if git diff --quiet "$base_tag" HEAD -- codex-unchained/upstream-patches; then
              reuse=true
            fi
          fi
          echo "tag=$base_tag" >> "$GITHUB_OUTPUT"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "Reusable patched Codex base: $reuse ${base_tag:+($base_tag)}"

      - name: Download reusable patched Codex package
        if: steps.codex-base.outputs.reuse == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/codex-base"
          if [ "${{ runner.os }}" = "Windows" ]; then
            root="$(cygpath -u "$RUNNER_TEMP")/codex-base"
          fi
          mkdir -p "$root"
          gh release download "${{ steps.codex-base.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ matrix.artifact }}.tar.gz" \
            --dir "$root"
          tar -xzf "$root/${{ matrix.artifact }}.tar.gz" -C "$root"
          test -f "$root/${{ matrix.artifact }}/codex-unchained${{ matrix.ext }}"
          test "$(tr -d '\r\n' < "$root/${{ matrix.artifact }}/UPSTREAM_SHA")" = "$(tr -d '\r\n' < codex-unchained/upstream-patches/UPSTREAM_SHA)"
          echo "CODEX_BASE_ROOT=$root/${{ matrix.artifact }}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codex-unchained-cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('codex-unchained/Cargo.lock', 'codex-unchained/upstream-patches/**') }}
          restore-keys: |
            codex-unchained-cargo-${{ runner.os }}-${{ matrix.target }}-

      - name: Validate POSIX bootstrap syntax
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n codex-unchained/install.sh

      - name: Validate Windows bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Get-Content "codex-unchained/install.ps1" -Raw
          $null = [scriptblock]::Create($source)

      - name: Fetch pinned upstream Codex
        if: steps.codex-base.outputs.reuse != 'true'
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < codex-unchained/upstream-patches/UPSTREAM_SHA)"
          root="$RUNNER_TEMP/codex-upstream"
          git init "$root"
          git -C "$root" remote add origin https://github.com/openai/codex.git
          git -C "$root" fetch --depth=1 origin "$sha"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$sha"
          echo "CODEX_UPSTREAM_ROOT=$root" >> "$GITHUB_ENV"

      - name: Apply Unchained patches
        if: steps.codex-base.outputs.reuse != 'true'
        shell: bash
        run: |
          python3 codex-unchained/upstream-patches/apply_0001.py "$CODEX_UPSTREAM_ROOT"
          python3 codex-unchained/upstream-patches/apply_0002.py "$CODEX_UPSTREAM_ROOT"
          python3 codex-unchained/upstream-patches/apply_0003.py "$CODEX_UPSTREAM_ROOT"
          python3 codex-unchained/upstream-patches/apply_0004.py "$CODEX_UPSTREAM_ROOT"
          python3 codex-unchained/upstream-patches/apply_0005.py "$CODEX_UPSTREAM_ROOT"
          git -C "$CODEX_UPSTREAM_ROOT" diff --check

      - name: Raise codex-chatgpt recursion limit
        if: steps.codex-base.outputs.reuse != 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path(r"${{ runner.temp }}") / "codex-upstream" / "codex-rs" / "chatgpt" / "src"
          lib = root / "lib.rs"
          text = lib.read_text(encoding="utf-8")
          attr = '#![recursion_limit = "256"]'
          if attr not in text:
              lib.write_text(attr + "\n" + text, encoding="utf-8")
          PY

      - name: Cache patched Codex target
        if: steps.codex-base.outputs.reuse != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/codex-upstream/codex-rs/target
          key: patched-codex-target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('codex-unchained/upstream-patches/**') }}
          restore-keys: |
            patched-codex-target-${{ runner.os }}-${{ matrix.target }}-

      - name: Cache ADP target
        uses: actions/cache@v4
        with:
          path: codex-unchained/target
          key: adp-target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('codex-unchained/Cargo.lock', 'codex-unchained/crates/**') }}
          restore-keys: |
            adp-target-${{ runner.os }}-${{ matrix.target }}-

      - name: Build patched Codex
        if: steps.codex-base.outputs.reuse != 'true'
        shell: bash
        run: cargo build --manifest-path "$CODEX_UPSTREAM_ROOT/codex-rs/Cargo.toml" -p codex-cli --release --target ${{ matrix.target }}

      - name: Build ADP helper CLI and MCP bridge
        shell: bash
        run: cargo build --manifest-path codex-unchained/Cargo.toml -p adp-unchained -p adp-mcp --release --target ${{ matrix.target }}

      - name: Build Windows sandbox helpers
        if: runner.os == 'Windows' && steps.codex-base.outputs.reuse != 'true'
        shell: bash
        run: |
          cargo build --manifest-path "$CODEX_UPSTREAM_ROOT/codex-rs/Cargo.toml" -p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner --release --target ${{ matrix.target }}
          cargo build --manifest-path "$CODEX_UPSTREAM_ROOT/codex-rs/Cargo.toml" -p codex-windows-sandbox-service --bin codex-windows-sandbox-service --release --target ${{ matrix.target }}

      - name: Assemble package
        shell: bash
        run: |
          dist="codex-unchained/dist/${{ matrix.artifact }}"
          mkdir -p "$dist"
          if [ "${{ steps.codex-base.outputs.reuse }}" = "true" ]; then
            cp "$CODEX_BASE_ROOT/codex-unchained${{ matrix.ext }}" "$dist/codex-unchained${{ matrix.ext }}"
          else
            cp "$CODEX_UPSTREAM_ROOT/codex-rs/target/${{ matrix.target }}/release/codex${{ matrix.ext }}" "$dist/codex-unchained${{ matrix.ext }}"
          fi
          cp "codex-unchained/target/${{ matrix.target }}/release/adp-mcp${{ matrix.ext }}" "$dist/adp-mcp${{ matrix.ext }}"
          cp "codex-unchained/target/${{ matrix.target }}/release/adp-unchained${{ matrix.ext }}" "$dist/adp-unchained${{ matrix.ext }}"
          cp -R codex-unchained/extension "$dist/extension"
          cp -R codex-unchained/antigravity-agent "$dist/antigravity-agent"
          cp codex-unchained/README.md "$dist/"
          cp codex-unchained/upstream-patches/UPSTREAM_SHA "$dist/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ "${{ steps.codex-base.outputs.reuse }}" = "true" ]; then
              cp "$CODEX_BASE_ROOT/codex-windows-sandbox-setup.exe" "$dist/"
              cp "$CODEX_BASE_ROOT/codex-windows-sandbox-service.exe" "$dist/"
              cp "$CODEX_BASE_ROOT/codex-command-runner.exe" "$dist/"
            else
              cp "$CODEX_UPSTREAM_ROOT/codex-rs/target/${{ matrix.target }}/release/codex-windows-sandbox-setup.exe" "$dist/"
              cp "$CODEX_UPSTREAM_ROOT/codex-rs/target/${{ matrix.target }}/release/codex-windows-sandbox-service.exe" "$dist/"
              cp "$CODEX_UPSTREAM_ROOT/codex-rs/target/${{ matrix.target }}/release/codex-command-runner.exe" "$dist/"
            fi
          fi
          test -f "$dist/codex-unchained${{ matrix.ext }}"
          test -f "$dist/adp-mcp${{ matrix.ext }}"
          test -f "$dist/adp-unchained${{ matrix.ext }}"
          tar -czf "codex-unchained/dist/${{ matrix.artifact }}.tar.gz" -C codex-unchained/dist "${{ matrix.artifact }}"

      - name: Smoke binary
        shell: bash
        run: |
          "codex-unchained/dist/${{ matrix.artifact }}/codex-unchained${{ matrix.ext }}" --version
          "codex-unchained/dist/${{ matrix.artifact }}/codex-unchained${{ matrix.ext }}" --help
          "codex-unchained/dist/${{ matrix.artifact }}/adp-unchained${{ matrix.ext }}" auth --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: codex-unchained/dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish installable release
    needs: package
    if: startsWith(github.ref, 'refs/tags/codex-unchained-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: patched-codex-*
          path: release-assets
          merge-multiple: true

      - name: Verify release matrix
        shell: bash
        run: |
          test -f release-assets/patched-codex-linux-x64.tar.gz
          test -f release-assets/patched-codex-linux-arm64.tar.gz
          test -f release-assets/patched-codex-macos-x64.tar.gz
          test -f release-assets/patched-codex-macos-arm64.tar.gz
          test -f release-assets/patched-codex-windows-x64.tar.gz
          sha256sum release-assets/*.tar.gz > release-assets/SHA256SUMS

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/codex-unchained-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             release-assets/*.tar.gz             release-assets/SHA256SUMS             codex-unchained/install.sh             codex-unchained/install.ps1             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Codex Unchained ${GITHUB_REF_NAME#codex-unchained-v}"             --generate-notes
