name: Codex Unchained Windows Package

concurrency:
  group: codex-unchained-package-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "codex-unchained-*"
    paths:
      - "codex-unchained/**"
      - ".github/workflows/codex-unchained-package.yml"

jobs:
  adp-unchained-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build ADP Unchained and Codex MCP bridge
        working-directory: codex-unchained
        run: cargo build -p adp-unchained -p adp-mcp --release

      - name: Smoke executable
        working-directory: codex-unchained
        shell: pwsh
        run: |
          .\target\release\adp-unchained.exe --help
          .\target\release\adp-unchained.exe web-search --help
          .\target\release\adp-unchained.exe replay --help
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"package-smoke","version":"1"}}}'
          $mcp = ($init | .\target\release\adp-mcp.exe | Out-String)
          if ($mcp -notmatch '"serverInfo"') { throw "adp-mcp initialize smoke failed" }

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "codex-unchained"
          $dist = Join-Path $root "dist\adp-unchained-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item (Join-Path $root "target\release\adp-unchained.exe") $dist
          Copy-Item (Join-Path $root "target\release\adp-mcp.exe") $dist
          Copy-Item -Recurse (Join-Path $root "extension") (Join-Path $dist "extension")
          Copy-Item (Join-Path $root "README.md") $dist
          Copy-Item (Join-Path $root "INSTALL-WINDOWS.ps1") $dist
          $zip = Join-Path $root "dist\adp-unchained-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $zip

      - uses: actions/upload-artifact@v4
        with:
          name: adp-unchained-windows-x64
          path: codex-unchained/dist/adp-unchained-windows-x64.zip
          if-no-files-found: error

  patched-codex-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Fetch pinned upstream Codex
        shell: pwsh
        run: |
          $sha = (Get-Content "codex-unchained\upstream-patches\UPSTREAM_SHA" -Raw).Trim()
          $root = Join-Path $env:RUNNER_TEMP "codex-upstream"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          git init $root
          git -C $root remote add origin https://github.com/openai/codex.git
          git -C $root fetch --depth=1 origin $sha
          git -C $root checkout --detach FETCH_HEAD
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $sha) { throw "Pinned Codex SHA mismatch: $actual != $sha" }
          "CODEX_UPSTREAM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply provider compatibility surgery
        shell: pwsh
        run: |
          python "codex-unchained\upstream-patches\apply_0001.py" "$env:CODEX_UPSTREAM_ROOT"
          python "codex-unchained\upstream-patches\apply_0002.py" "$env:CODEX_UPSTREAM_ROOT"
          python "codex-unchained\upstream-patches\apply_0003.py" "$env:CODEX_UPSTREAM_ROOT"
          python "codex-unchained\upstream-patches\apply_0004.py" "$env:CODEX_UPSTREAM_ROOT"
          git -C "$env:CODEX_UPSTREAM_ROOT" diff --check

      - name: Build patched Codex CLI and ADP MCP bridge
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:CODEX_UPSTREAM_ROOT "codex-rs")
          cargo build -p codex-cli --release
          cargo build -p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner --release
          cargo build -p codex-windows-sandbox-service --bin codex-windows-sandbox-service --release
          Pop-Location
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "codex-unchained")
          cargo build -p adp-unchained -p adp-mcp --release
          Pop-Location

      - name: Smoke patched Codex
        shell: pwsh
        run: |
          $exe = Join-Path $env:CODEX_UPSTREAM_ROOT "codex-rs\target\release\codex.exe"
          & $exe --version
          $help = (& $exe --help | Out-String)
          if ($help -notmatch "Usage: codex-unchained") { throw "Unchained command identity smoke failed" }
          $help | Select-Object -First 40
          & (Join-Path $env:GITHUB_WORKSPACE "codex-unchained\target\release\adp-unchained.exe") auth --help

      - name: Assemble patched Codex artifact
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "codex-unchained\dist\patched-codex-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item (Join-Path $env:CODEX_UPSTREAM_ROOT "codex-rs\target\release\codex.exe") (Join-Path $dist "codex-unchained.exe")
          Copy-Item (Join-Path $env:CODEX_UPSTREAM_ROOT "codex-rs\target\release\codex-windows-sandbox-setup.exe") $dist
          Copy-Item (Join-Path $env:CODEX_UPSTREAM_ROOT "codex-rs\target\release\codex-windows-sandbox-service.exe") $dist
          Copy-Item (Join-Path $env:CODEX_UPSTREAM_ROOT "codex-rs\target\release\codex-command-runner.exe") $dist
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "codex-unchained\target\release\adp-mcp.exe") $dist
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "codex-unchained\target\release\adp-unchained.exe") $dist
          Copy-Item -Recurse (Join-Path $env:GITHUB_WORKSPACE "codex-unchained\extension") (Join-Path $dist "extension")
          Copy-Item -Recurse (Join-Path $env:GITHUB_WORKSPACE "codex-unchained\antigravity-agent") (Join-Path $dist "antigravity-agent")
          Copy-Item "codex-unchained\INSTALL-CODEX-WINDOWS.ps1" $dist
          Copy-Item "codex-unchained\README.md" $dist
          Copy-Item "codex-unchained\upstream-patches\UPSTREAM_SHA" $dist
          Copy-Item "codex-unchained\docs\UPSTREAM_CODEX_INTEGRATION.md" $dist
          $zip = Join-Path $env:GITHUB_WORKSPACE "codex-unchained\dist\patched-codex-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $zip

      - name: Smoke isolated Unchained installer
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "codex-unchained\dist\patched-codex-windows-x64"
          $profile = Join-Path $env:RUNNER_TEMP "unchained-profile"
          $install = Join-Path $env:RUNNER_TEMP "unchained-install"
          $unchainedHome = Join-Path $profile ".codex-unchained"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          New-Item -ItemType Directory -Force -Path $unchainedHome | Out-Null
          $legacyConfig = @(
            'model = "ollama-local/qwen3:1.7b"'
            'model_provider = "unchained"'
            'oss_provider = "ollama"'
            ''
            '[model_providers.unchained]'
            'name = "ADP Unchained Model Router"'
            'base_url = "http://127.0.0.1:8766/v1"'
            'wire_api = "responses"'
            'requires_openai_auth = false'
          )
          $legacyConfig | Set-Content -Path (Join-Path $unchainedHome "config.toml") -Encoding UTF8
          $oldUserProfile = $env:USERPROFILE
          try {
            $env:USERPROFILE = $profile
            & (Join-Path $dist "INSTALL-CODEX-WINDOWS.ps1") -InstallRoot $install -UnchainedHome $unchainedHome
          }
          finally {
            $env:USERPROFILE = $oldUserProfile
          }
          $config = Join-Path $unchainedHome "config.toml"
          if (-not (Test-Path $config)) { throw "Unchained config was not created" }
          $text = Get-Content $config -Raw
          if ($text -notmatch 'model_provider\s*=\s*"unchained"') { throw "Unchained provider missing" }
          if ($text -notmatch '\[model_providers\.unchained\]') { throw "Unchained provider block missing" }
          if ($text -notmatch 'model_catalog_url\s*=\s*"http://127\.0\.0\.1:8766/v1/models"') { throw "Unchained model catalog URL missing" }
          if ($text -notmatch '\[mcp_servers\.adp\]') { throw "ADP MCP block missing" }
          if ($text -notmatch 'model\s*=\s*"adp/auto"') { throw "Legacy v0.1 default was not migrated to ADP Auto" }
          if (-not (Test-Path (Join-Path $install "adp-unchained.exe"))) { throw "ADP auth/helper CLI missing" }
          if (-not (Test-Path (Join-Path $install "codex-windows-sandbox-setup.exe"))) { throw "Windows sandbox setup helper missing" }
          if (-not (Test-Path (Join-Path $install "codex-windows-sandbox-service.exe"))) { throw "Windows sandbox service helper missing" }
          if (-not (Test-Path (Join-Path $install "codex-command-runner.exe"))) { throw "Windows command runner helper missing" }
          if (Test-Path (Join-Path $profile ".codex")) { throw "Installer touched normal Codex home" }
          if (-not (Test-Path (Join-Path $profile ".gemini\config\agents\adp-unchained-brain\agent.md"))) {
            throw "Antigravity brain-only agent was not installed"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: patched-codex-windows-x64
          path: codex-unchained/dist/patched-codex-windows-x64.zip
          if-no-files-found: error
