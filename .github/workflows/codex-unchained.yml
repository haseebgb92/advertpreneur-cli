name: Codex Unchained

on:
  push:
    branches:
      - "codex-unchained-*"
    paths:
      - "codex-unchained/**"
      - ".github/workflows/codex-unchained.yml"
  pull_request:
    paths:
      - "codex-unchained/**"
      - ".github/workflows/codex-unchained.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-unchained
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  extension-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check codex-unchained/extension/background.js
      - run: node --check codex-unchained/extension/content.js

  upstream-tool-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fetch pinned Codex upstream
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cat codex-unchained/upstream-patches/UPSTREAM_SHA)"
          git init /tmp/codex
          git -C /tmp/codex remote add origin https://github.com/openai/codex.git
          git -C /tmp/codex fetch --depth=1 origin "$SHA"
          git -C /tmp/codex checkout --detach FETCH_HEAD
          test "$(git -C /tmp/codex rev-parse HEAD)" = "$SHA"
      - name: Apply ADP compatibility surgery
        run: |
          python codex-unchained/upstream-patches/apply_0001.py /tmp/codex
          python codex-unchained/upstream-patches/apply_0002.py /tmp/codex
      - name: Validate patch formatting
        shell: bash
        run: |
          set -euo pipefail
          git -C /tmp/codex diff --check
          cd /tmp/codex/codex-rs
          cargo fmt --all -- --check
      - name: Show exact upstream diff
        run: git -C /tmp/codex diff -- codex-rs/core/src/tools/router.rs codex-rs/core/src/tools/router_tests.rs
      - name: Run focused Codex compatibility tests
        working-directory: /tmp/codex/codex-rs
        run: |
          cargo test -p codex-core build_tool_call_ --lib
          cargo test -p codex-models-manager unknown_model_keeps_local_tool_discovery_and_extension_instructions --lib

