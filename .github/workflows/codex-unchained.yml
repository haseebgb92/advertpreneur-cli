name: Codex Unchained

on:
  push:
    branches:
      - "codex-unchained-*"
    paths:
      - "codex-unchained/**"
      - ".github/workflows/codex-unchained.yml"
  pull_request:
    paths:
      - "codex-unchained/**"
      - ".github/workflows/codex-unchained.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-unchained
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  extension-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check codex-unchained/extension/background.js
      - run: node --check codex-unchained/extension/content.js
