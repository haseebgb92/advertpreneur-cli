name: Rust Migration CI

on:
  push:
    branches:
      - rust-migration-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore checksum-verified Rust compile harness
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".ci\rust-src-*.b64" | Sort-Object Name
          if ($parts.Count -ne 11) {
            throw "Expected 11 Rust source chunks, got $($parts.Count)"
          }

          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          $zip = Join-Path $env:RUNNER_TEMP "adp-rust-compile-harness.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "d1607d183be4bffbb9358bb863144f84513c74284b8d50e15de70c113b6fe4eb") {
            throw "Compile harness checksum mismatch: $hash"
          }

          $dst = Join-Path $env:RUNNER_TEMP "adp-rust-validation"
          if (Test-Path $dst) {
            Remove-Item -Recurse -Force $dst
          }
          New-Item -ItemType Directory -Path $dst | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst

          $src = Join-Path $dst "adp-rust-compile-harness"
          if (-not (Test-Path (Join-Path $src "Cargo.toml"))) {
            throw "Cargo.toml missing after harness extraction."
          }

          "ADP_RUST_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Compile harness restored and checksum verified."

      - name: Apply deterministic migration cleanup
        shell: pwsh
        run: |
          python .ci/apply-rust-cleanups.py $env:ADP_RUST_SRC

      - name: Normalize validated Rust base
        shell: pwsh
        run: |
          Set-Location $env:ADP_RUST_SRC
          cargo fmt

      - name: Apply native UX parity repair
        shell: pwsh
        run: |
          $parts = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE ".ci\ux-repair-*.patch") | Sort-Object Name
          if ($parts.Count -ne 4) {
            throw "Expected 4 UX repair patch chunks, got $($parts.Count)"
          }
          $patchText = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName).Replace("`r`n","`n").Replace("`r","`n") }) -join ""
          $patch = Join-Path $env:RUNNER_TEMP "adp-ux-repair.patch"
          [IO.File]::WriteAllText($patch, $patchText, [Text.UTF8Encoding]::new($false))
          $hash = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "6434d75cee0560419b4475a8643a586e31516023994b2e783638d54c6e8b17e6") {
            throw "UX repair patch checksum mismatch: $hash"
          }
          Set-Location $env:ADP_RUST_SRC
          git apply --check $patch
          git apply $patch
          Write-Host "Native UX parity repair applied."

      - name: Apply canonical Rust formatting
        shell: pwsh
        run: |
          Set-Location $env:ADP_RUST_SRC
          cargo fmt

      - name: Verify UX experience contract
        shell: pwsh
        run: |
          $main = [IO.File]::ReadAllText((Join-Path $env:ADP_RUST_SRC "crates\adp-cli\src\main.rs"))
          $ui = [IO.File]::ReadAllText((Join-Path $env:ADP_RUST_SRC "crates\adp-cli\src\ui.rs"))
          $required = @(
            @($main, "ui::banner"),
            @($main, "ui::prompt"),
            @($main, "ui::tool_description"),
            @($main, "ui::result_card"),
            @($main, "ui::begin_task"),
            @($ui, "Message Advertpreneur"),
            @($ui, "pub fn event"),
            @($ui, "pub fn result_card"),
            @($ui, "pub fn set_working")
          )
          foreach ($pair in $required) {
            if (-not $pair[0].Contains($pair[1])) {
              throw "UX contract missing: $($pair[1])"
            }
          }
          Write-Host "Rust UI experience contract passed."

      - name: Verify Rust formatting
        shell: pwsh
        run: |
          Set-Location $env:ADP_RUST_SRC
          cargo fmt --check

      - name: Cargo check
        shell: pwsh
        run: |
          Set-Location $env:ADP_RUST_SRC
          cargo check --workspace

      - name: Cargo test
        shell: pwsh
        run: |
          Set-Location $env:ADP_RUST_SRC
          cargo test --workspace

      - name: Release build
        shell: pwsh
        run: |
          Set-Location $env:ADP_RUST_SRC
          cargo build --release -p adp

      - name: Smoke version
        shell: pwsh
        run: |
          Set-Location $env:ADP_RUST_SRC
          .\target\release\adp.exe --version

      - name: Upload validated Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: adp-windows-validation
          path: ${{ env.ADP_RUST_SRC }}\target\release\adp.exe
          if-no-files-found: error

      - name: Upload canonical formatted Rust source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adp-rust-formatted-source
          path: |
            ${{ env.ADP_RUST_SRC }}\Cargo.toml
            ${{ env.ADP_RUST_SRC }}\crates
          if-no-files-found: error
